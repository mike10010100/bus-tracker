version: "3.8"

services:
  transit-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: transit-tracker:${IMAGE_TAG:-latest}
    container_name: transit-tracker
    restart: unless-stopped
    # On Linux servers (Raspberry Pi, mini PC, NAS, Unraid), network_mode: host
    # allows the container to bind directly to the LAN interface. This enables:
    # 1. Zero-config mDNS service advertisement (_transittracker._tcp.local)
    # 2. Receiving Kindle UDP discovery broadcasts (port 8001) without NAT traversal
    network_mode: host
    environment:
      - PORT=${PORT:-8000}
      - TZ=${TZ:-America/New_York}
      - NJT_USERNAME=${NJT_USERNAME:-}
      - NJT_PASSWORD=${NJT_PASSWORD:-}
      - NJT_API_USERNAME=${NJT_API_USERNAME:-}
      - NJT_API_PASSWORD=${NJT_API_PASSWORD:-}
      # Peak commute windows (decimal hours), overridable without a rebuild.
      - PEAK_AM_START=${PEAK_AM_START:-7.5}
      - PEAK_AM_END=${PEAK_AM_END:-9.5}
      - PEAK_PM_START=${PEAK_PM_START:-16.5}
      - PEAK_PM_END=${PEAK_PM_END:-19.0}
      # Overnight deep-eco window and its long poll interval (seconds).
      - OVERNIGHT_START=${OVERNIGHT_START:-22.0}
      - OVERNIGHT_END=${OVERNIGHT_END:-6.0}
      - OVERNIGHT_INTERVAL=${OVERNIGHT_INTERVAL:-3600}
      - OFFPEAK_INTERVAL=${OFFPEAK_INTERVAL:-600}
      # Testing aid: force the fast poll interval at all hours.
      - FORCE_FAST_POLL=${FORCE_FAST_POLL:-}
      # Run mode the client should adopt and stick to (e.g. sleep-suspend for a
      # dedicated dashboard). Empty = don't care.
      - TRACKER_DEFAULT_MODE=${TRACKER_DEFAULT_MODE:-}
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist the GTFS static-schedule index across container recreates so the
      # 55 MB feed isn't re-downloaded and re-parsed on every deploy.
      - tracker-cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracker-cache:

