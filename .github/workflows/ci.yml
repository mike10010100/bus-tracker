name: CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-client:
    name: Go Client (test, vet, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-go

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Formatting (gofmt)
        run: |
          DIFF=$(gofmt -s -d .)
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            echo "ERROR: Go files are not formatted properly. Run 'gofmt -s -w .' locally."
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Enforce Go Coverage Gate (90%)
        run: bash ../scripts/check_coverage_go.sh 90

      - name: Cross-Compile ARMv7 Binary for Kindle
        run: |
          VERSION=$(cat ../VERSION)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.Version=${VERSION}" -o ../tracker-arm .
          ls -lh ../tracker-arm

      - name: Upload Kindle ARM Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-arm
          path: tracker-arm

  python-server:
    name: Python Server (tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Python unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Enforce Python Coverage Gate (90%)
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s . -p "test_*.py" >/dev/null
          python -m coverage report -m
