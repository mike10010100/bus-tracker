name: CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-go

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: client-go/go.sum

      - name: Verify Formatting (gofmt)
        run: |
          DIFF=$(gofmt -s -d .)
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            echo "ERROR: Go files are not formatted properly. Run 'gofmt -s -w .' locally."
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Cross-Compile ARMv7 Binary for Kindle
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o ../tracker-arm .
          ls -lh ../tracker-arm

      - name: Upload Kindle ARM Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-arm
          path: tracker-arm
